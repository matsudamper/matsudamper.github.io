name: Convert history images

on:
  push:
    branches:
      - update-env3

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert images
        run: |
          if [ ! -f environment/history1/picture.jpg ] && [ ! -f environment/history2/picture.jpg ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -q 80 environment/history1/picture.jpg -o environment/history1/picture.webp
          cwebp -q 80 environment/history2/picture.jpg -o environment/history2/picture.webp
          git rm environment/history1/picture.jpg environment/history2/picture.jpg
          git add environment/history1/picture.webp environment/history2/picture.webp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Convert history images to WebP"
          git push
